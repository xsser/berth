[package]
name = "berth-app"
description = "berth GUI client (winit + wgpu grid renderer + egui sidebar) and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
berth-core.workspace = true
winit.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
cosmic-text.workspace = true
swash.workspace = true
etagere.workspace = true
bytemuck.workspace = true
pollster.workspace = true
arboard.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
unicode-width.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
png.workspace = true
rustc-hash.workspace = true
libc.workspace = true
postcard.workspace = true
# `berth setup-hooks`: format-preserving edit of ~/.codex/config.toml and the
# preview diff.
toml_edit = "0.25"
similar = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys.workspace = true
# Dock badge (`NSApp.dockTile.badgeLabel`); the versions winit already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSDockTile"] }

[dev-dependencies]
# Client tests run the real daemon in-process on a temporary `Paths::in_dir`.
berth-daemon = { path = "../berth-daemon" }
tokio.workspace = true
tempfile.workspace = true
