[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xsser/berth"

[workspace.dependencies]
berth-core = { path = "crates/berth-core" }
berth-vt = { path = "crates/berth-vt" }
berth-store = { path = "crates/berth-store" }

# shared
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["use-std"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
bitflags = { version = "2.13", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"

# daemon
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process", "fs"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.14"

# app
winit = "0.30.13"
wgpu = "30.0"
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
cosmic-text = "0.19"
swash = "0.2"
etagere = "0.3"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
arboard = "3.6"
toml = "1.1"
notify = "8.2"
mac-notification-sys = "0.6"
png = "0.18"
rustc-hash = "2.1"

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
