<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="berth logo">
  <title>berth</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b303a"/>
      <stop offset="1" stop-color="#1c1f26"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="16" y="32" width="224" height="192" rx="34" fill="url(#tile)"/>
  <rect x="16.5" y="32.5" width="223" height="191" rx="33.5" fill="none" stroke="#3b424e" stroke-width="3"/>

  <!-- left sidebar: the workspace / session list -->
  <path d="M50 32h34v192H50a34 34 0 0 1-34-34V66a34 34 0 0 1 34-34z" fill="#171a20"/>
  <line x1="84" y1="44" x2="84" y2="212" stroke="#3b424e" stroke-width="3"/>

  <!-- session badges: running, needs attention, idle -->
  <circle cx="50" cy="92" r="9" fill="#b5bd68"/>
  <circle cx="50" cy="128" r="9" fill="#de935f"/>
  <circle cx="50" cy="164" r="9" fill="#5c636e"/>

  <!-- prompt and block cursor: the berth where a session docks -->
  <path d="M120 106l26 22-26 22" fill="none" stroke="#de935f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="166" y="108" width="42" height="40" rx="6" fill="#81a2be"/>
</svg>
